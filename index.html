<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inventory Management</title>
  <style>
    body{margin:0;background:#f4f7fb;color:#1f2937;font-family:Arial,sans-serif}header{background:#232f3e;color:#fff;padding:24px;text-align:center}main{max-width:900px;margin:30px auto;padding:0 20px}.card{background:#fff;border-radius:10px;box-shadow:0 3px 12px #0002;margin-bottom:24px;padding:24px}form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}input,button{padding:10px;border:1px solid #d1d5db;border-radius:5px;font-size:15px}button{background:#ff9900;border:0;font-weight:bold;cursor:pointer}.delete{background:#dc2626;color:white}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#eef2f7}@media(max-width:700px){form{grid-template-columns:1fr}}
  </style>
</head>
<body>
<header><h1>Inventory Management System</h1><p>Spring Boot application deployed through AWS CI/CD</p></header>
<main>
  <section class="card"><h2>Add Inventory Item</h2><form id="form"><input id="name" placeholder="Product name" required><input id="quantity" type="number" min="0" placeholder="Quantity" required><input id="price" type="number" min="0" step="0.01" placeholder="Price" required><button>Add Item</button></form></section>
  <section class="card"><h2>Current Inventory</h2><table><thead><tr><th>ID</th><th>Product</th><th>Quantity</th><th>Price</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section>
</main>
<script>
const api='/api/inventory',rows=document.getElementById('rows'),form=document.getElementById('form');
async function load(){const data=await(await fetch(api)).json();rows.innerHTML=data.map(i=>`<tr><td>${i.id}</td><td>${i.name}</td><td>${i.quantity}</td><td>$${Number(i.price).toFixed(2)}</td><td><button class="delete" onclick="removeItem(${i.id})">Delete</button></td></tr>`).join('')}
form.addEventListener('submit',async e=>{e.preventDefault();const item={name:document.getElementById('name').value,quantity:Number(document.getElementById('quantity').value),price:Number(document.getElementById('price').value)};await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});form.reset();load()});
async function removeItem(id){await fetch(`${api}/${id}`,{method:'DELETE'});load()}load();
</script>
</body>
</html>
